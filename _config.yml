title: CSCI 264 — Assembly Language
description: Lecture notes, Fall 2026
baseurl: "/csci264"
theme: minima
markdown: kramdown
future: true
collections:
  lectures:
    output: true
    permalink: /lectures/:name/
  code_chapters:
    output: true
    permalink: /code/:path/
defaults:
  - scope:
      path: ""
      type: lectures
    values:
      layout: page
  - scope:
      path: ""
      type: code_chapters
    values:
      layout: page
  # Any index.md inside a labs/ subdirectory becomes a lab page automatically.
  # `order` controls the position in the Labs index; override it per lab.
  - scope:
      path: "labs"
    values:
      layout: lab
      order: 0
header_pages:
  - lectures.md
  - labs.md
  - code.md